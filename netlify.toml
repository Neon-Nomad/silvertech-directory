[build]
  publish = "dist"
  command = "npm run export-facilities && npx tsx scripts/build_facilities_index.ts && npm run sitemap && BUILD_TIME=$(date -u +\"%Y-%m-%dT%H:%M:%SZ\") npm run build:hybrid"

# Force http + www variants directly to canonical https non-www
[[redirects]]
  from = "http://www.silvertechdirectory.com/*"
  to = "https://silvertechdirectory.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://silvertechdirectory.com/*"
  to = "https://silvertechdirectory.com/:splat"
  status = 301
  force = true

# Force www -> non-www at the edge (before _redirects processing)
[[redirects]]
  from = "https://www.silvertechdirectory.com/*"
  to = "https://silvertechdirectory.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/facility/*"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/senior-living/*"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/states/:state/regulatory"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/states/:state/regulations"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/states/:state/regulations/*"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/regulatory-library"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/regulatory-library/*"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/assisted-living/:state/cities/:city"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/assisted-living/:state/cities/:city/"
  to = "/410.html"
  status = 410
  force = true

[[edge_functions]]
  path = "/community/*"
  function = "facility-metadata"
