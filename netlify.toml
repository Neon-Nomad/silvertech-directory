[build]
  publish = "dist"
  command = "npm run sitemap && BUILD_TIME=$(date -u +\"%Y-%m-%dT%H:%M:%SZ\") npm run build:hybrid"

# Force www -> non-www at the edge (before _redirects processing)
[[redirects]]
  from = "https://www.silvertechdirectory.com/*"
  to = "https://silvertechdirectory.com/:splat"
  status = 301
  force = true

[[edge_functions]]
  path = "/senior-living/*"
  function = "facility-metadata"
