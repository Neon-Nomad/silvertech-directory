version: 1.1.0
last_updated: 2026-03-21
context: SilverTech Ingestion and API Foundation

entities:
  facility:
    primary_key: id
    pii: false
  lead:
    primary_key: id
    pii: true
  lead_event:
    primary_key: id
    pii: false
  facility_profile:
    primary_key: facility_id
    pii: false
  qa_question:
    primary_key: id
    pii: false
  qa_answer:
    primary_key: id
    pii: false
  billing_event:
    primary_key: id
    pii: false

event_contract:
  required_fields:
    - schema_version
    - source_system
    - canonical_entity
    - occurred_at
    - payload
  idempotency_key:
    - source_system
    - source_event_id

raw_layer:
  append_only_tables:
    - raw_events
    - raw_source_snapshots
  allowed_payload_types:
    raw_events: object
    raw_source_snapshots:
      - object
      - array

api_read_models:
  version_prefix: api_v1_
  models:
    - api_v1_facility_profile_summary
    - api_v1_lead_lifecycle
    - api_v1_attribution_funnel_daily
  required_fields:
    - data_as_of
    - confidence_score

trust_enrichment:
  facility_trigger: normalize_success
  injected_fields:
    - profile_strength
    - market_benchmark
    - enriched_at
  profile_strength_range:
    min: 0
    max: 100
  market_benchmark:
    scope_priority:
      - zip
      - state
    required_fields:
      - scope
      - facility_count
      - avg_monthly_rate
      - confidence
  lineage_view: api_internal_facility_lineage

activation_analytics:
  table: operator_activation_events
  required_fields:
    - operator_id
    - facility_id
    - session_id
    - plan_tier
    - activation_score
    - source_screen
    - occurred_at
  benchmark_thresholds:
    min_profile_views: 25
    min_inquiries: 5
  cta_gate:
    checklist_completion_lt: 0.8
    photos_lt: 10
    benchmark_gap_pct_gte: 0.03
  funnel_steps:
    - operator_claim_completed
    - operator_activation_screen_viewed
    - field_updated
    - checklist_step_completed
    - benchmark_module_viewed
    - roi_module_viewed
    - premium_cta_clicked
    - premium_trial_started

family_journey:
  status_flow:
    - researching
    - touring
    - shortlist
    - selected
    - moved_in
  terminal_status:
    - moved_in
  branch_status:
    - declined
  allowed_transitions:
    - from: researching
      to:
        - touring
        - shortlist
        - selected
        - declined
    - from: touring
      to:
        - shortlist
        - selected
        - declined
    - from: shortlist
      to:
        - selected
        - declined
    - from: selected
      to:
        - moved_in
        - declined
    - from: declined
      to:
        - researching
        - touring
        - shortlist
        - selected
        - declined
  resolver:
    source: current_facility_status
    order_by:
      - user_id
      - facility_id
      - created_at DESC
      - id DESC
  event_tables:
    - saved_facilities
    - facility_status_history
    - facility_notes
    - tour_logs
    - move_ins
    - attribution
  idempotency:
    table: idempotency_keys
    required_actions:
      - save
      - status
      - move_in
      - attribution
    key_fields:
      - user_id
      - action_type
      - idempotency_key
  metrics_definitions:
    save_rate_per_session: sessions_with_save / total_sessions
    pct_to_touring: users_with_touring / users_with_save
    pct_to_moved_in: users_with_move_in / users_with_save
