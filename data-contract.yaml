version: 1.0.0
last_updated: 2026-02-15
context: SilverTech Ingestion and API Foundation

entities:
  facility:
    primary_key: id
    pii: false
  lead:
    primary_key: id
    pii: true
  lead_event:
    primary_key: id
    pii: false
  facility_profile:
    primary_key: facility_id
    pii: false
  qa_question:
    primary_key: id
    pii: false
  qa_answer:
    primary_key: id
    pii: false
  billing_event:
    primary_key: id
    pii: false

event_contract:
  required_fields:
    - schema_version
    - source_system
    - canonical_entity
    - occurred_at
    - payload
  idempotency_key:
    - source_system
    - source_event_id

raw_layer:
  append_only_tables:
    - raw_events
    - raw_source_snapshots
  allowed_payload_types:
    raw_events: object
    raw_source_snapshots:
      - object
      - array

api_read_models:
  version_prefix: api_v1_
  models:
    - api_v1_facility_profile_summary
    - api_v1_lead_lifecycle
    - api_v1_attribution_funnel_daily
  required_fields:
    - data_as_of
    - confidence_score

trust_enrichment:
  facility_trigger: normalize_success
  injected_fields:
    - profile_strength
    - market_benchmark
    - enriched_at
  profile_strength_range:
    min: 0
    max: 100
  market_benchmark:
    scope_priority:
      - zip
      - state
    required_fields:
      - scope
      - facility_count
      - avg_monthly_rate
      - confidence
  lineage_view: api_internal_facility_lineage
