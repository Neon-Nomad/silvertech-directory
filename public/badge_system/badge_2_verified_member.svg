<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 72" width="200" height="72">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E2A3A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F1C2E;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="border2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:0.6" />
    </linearGradient>
  </defs>
  <!-- Badge background -->
  <rect x="1" y="1" width="198" height="70" rx="10" ry="10" fill="url(#bg2)" stroke="url(#border2)" stroke-width="1.5"/>
  <!-- Left accent bar -->
  <rect x="1" y="1" width="4" height="70" rx="2" ry="2" fill="#3B82F6"/>
  <!-- Icon: shield with checkmark -->
  <g transform="translate(20, 36)">
    <path d="M0,-11 L9,-7 L9,2 C9,7 5,11 0,13 C-5,11 -9,7 -9,2 L-9,-7 Z" fill="none" stroke="#3B82F6" stroke-width="1.5" stroke-linejoin="round"/>
    <polyline points="-4,1 -1,4 5,-3" fill="none" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Badge text -->
  <text x="40" y="28" font-family="Georgia, serif" font-size="8" font-weight="600" letter-spacing="2" fill="#3B82F6" text-anchor="start">SILVERTECH</text>
  <text x="40" y="46" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#E5E7EB" text-anchor="start">Verified Member</text>
  <!-- Sub label -->
  <text x="40" y="60" font-family="Arial, sans-serif" font-size="7.5" fill="#6B7280" text-anchor="start" letter-spacing="0.5">Active subscription</text>
</svg>
