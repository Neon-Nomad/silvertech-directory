<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 72" width="200" height="72">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2A1F0A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A1200;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="border4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D97706;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B45309;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="gold4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FCD34D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Badge background -->
  <rect x="1" y="1" width="198" height="70" rx="10" ry="10" fill="url(#bg4)" stroke="url(#border4)" stroke-width="1.5"/>
  <!-- Left accent bar -->
  <rect x="1" y="1" width="4" height="70" rx="2" ry="2" fill="url(#gold4)"/>
  <!-- Icon: dollar sign in circle -->
  <g transform="translate(20, 36)">
    <circle cx="0" cy="0" r="11" fill="none" stroke="url(#gold4)" stroke-width="1.5"/>
    <text x="0" y="1" font-family="Georgia, serif" font-size="13" font-weight="700" fill="url(#gold4)" text-anchor="middle" dominant-baseline="middle">$</text>
  </g>
  <!-- Badge text -->
  <text x="40" y="26" font-family="Georgia, serif" font-size="8" font-weight="600" letter-spacing="2" fill="#D97706" text-anchor="start">AVAILABILITY &amp; PRICING</text>
  <text x="40" y="44" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#FCD34D" text-anchor="start">Verified</text>
  <!-- Sub label -->
  <text x="40" y="60" font-family="Arial, sans-serif" font-size="7.5" fill="#92400E" text-anchor="start" letter-spacing="0.5">Live beds · Current pricing published</text>
</svg>
