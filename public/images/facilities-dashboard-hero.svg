<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">SilverTech Operator Dashboard Preview</title>
  <desc id="desc">A clean preview of the SilverTech operator dashboard showing profile completion, activation funnel, and performance metrics.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbf9f4" />
      <stop offset="100%" stop-color="#f3efe6" />
    </linearGradient>
    <linearGradient id="verified" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f2937" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
    <style>
      .sans { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .serif { font-family: "Times New Roman", Georgia, serif; }
      .h1 { font-size: 38px; font-weight: 700; fill: #111827; }
      .h2 { font-size: 22px; font-weight: 700; fill: #111827; }
      .body { font-size: 17px; font-weight: 500; fill: #334155; }
      .muted { font-size: 15px; font-weight: 500; fill: #64748b; }
      .label { font-size: 13px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; fill: #64748b; }
      .metric { font-size: 52px; font-weight: 700; fill: #0f172a; }
      .smallMetric { font-size: 42px; font-weight: 700; fill: #0f172a; }
      .btn { font-size: 19px; font-weight: 700; fill: #ffffff; }
      .chip { font-size: 14px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; fill: #f8fafc; }
      .logo { font-size: 56px; font-weight: 700; fill: #1f2937; }
      .gold { fill: #b68a3e; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)" />

  <rect x="72" y="72" width="1456" height="856" rx="22" fill="#ffffff" stroke="#e5e7eb" filter="url(#softShadow)" />

  <text x="118" y="150" class="logo serif">SilverTech</text>
  <circle cx="455" cy="130" r="26" fill="none" stroke="#b68a3e" stroke-width="6" />
  <line x1="455" y1="104" x2="455" y2="156" stroke="#b68a3e" stroke-width="4" />
  <line x1="429" y1="130" x2="481" y2="130" stroke="#b68a3e" stroke-width="4" />
  <line x1="436" y1="112" x2="474" y2="148" stroke="#b68a3e" stroke-width="4" />
  <line x1="474" y1="112" x2="436" y2="148" stroke="#b68a3e" stroke-width="4" />

  <rect x="1200" y="102" width="250" height="52" rx="14" fill="url(#verified)" />
  <circle cx="1233" cy="128" r="11" fill="#22c55e" />
  <text x="1255" y="134" class="chip sans">SilverTech Verified</text>

  <rect x="112" y="190" width="1376" height="166" rx="16" fill="#fff8ea" stroke="#ead7ad" />
  <text x="144" y="245" class="h2 sans">Complete your profile to power your dashboard</text>
  <text x="144" y="279" class="body sans">You are on a paid plan, but setup is 28% complete. Add missing listing details so insights and ranking signals are more accurate.</text>
  <rect x="144" y="302" width="236" height="42" rx="12" fill="#a77730" />
  <text x="170" y="330" class="btn sans">Complete profile setup</text>
  <text x="1186" y="252" class="h2 sans">team@silvertechdirectory.com</text>
  <text x="1186" y="282" class="body sans">Operator account</text>

  <rect x="112" y="386" width="390" height="252" rx="16" fill="#ffffff" stroke="#e5e7eb" />
  <text x="144" y="440" class="h2 sans">Next Best Fix</text>
  <line x1="144" y1="458" x2="470" y2="458" stroke="#e2e8f0" />
  <text x="144" y="502" class="body sans">Add a pricing range to increase profile score by +20.</text>
  <rect x="144" y="548" width="194" height="58" rx="12" fill="#111827" />
  <text x="172" y="586" class="btn sans">Update pricing</text>

  <rect x="534" y="386" width="954" height="252" rx="16" fill="#ffffff" stroke="#e5e7eb" />
  <text x="566" y="440" class="h2 sans">Activation Funnel (Last 30 Days)</text>
  <text x="1380" y="440" class="muted sans">Updated today</text>
  <text x="566" y="482" class="muted sans">Claim  >  View  >  Edit  >  Checklist  >  Benchmark  >  CTA  >  Trial</text>
  <line x1="566" y1="500" x2="1454" y2="500" stroke="#e2e8f0" />
  <text x="566" y="552" class="h2 sans">Gathering Data</text>
  <text x="566" y="590" class="body sans">We need at least 5 claim sessions in the last 30 days to show stable funnel rates.</text>
  <text x="566" y="620" class="body sans">Keep driving claim and activation flow to unlock drop-off insights.</text>

  <rect x="112" y="664" width="390" height="216" rx="16" fill="#ffffff" stroke="#e5e7eb" />
  <text x="144" y="718" class="h2 sans">Guided Setup</text>
  <line x1="144" y1="736" x2="470" y2="736" stroke="#e2e8f0" />
  <text x="144" y="787" class="h2 sans">1/5 complete</text>
  <text x="410" y="787" class="muted sans">15/100 score</text>
  <rect x="144" y="810" width="326" height="12" rx="6" fill="#e2e8f0" />
  <rect x="144" y="810" width="74" height="12" rx="6" fill="#94a3b8" />

  <rect x="534" y="664" width="954" height="216" rx="16" fill="#ffffff" stroke="#e5e7eb" />
  <text x="566" y="718" class="h2 sans">Performance Overview</text>
  <text x="566" y="752" class="body sans">Your listing is performing better than 68% of homes in your area.</text>

  <rect x="566" y="770" width="220" height="92" rx="12" fill="#f8fafc" stroke="#e2e8f0" />
  <text x="590" y="799" class="label sans">Profile Views</text>
  <text x="590" y="847" class="smallMetric sans">1,250</text>

  <rect x="802" y="770" width="220" height="92" rx="12" fill="#f8fafc" stroke="#e2e8f0" />
  <text x="826" y="799" class="label sans">Leads Received</text>
  <text x="826" y="847" class="smallMetric sans">45</text>

  <rect x="1038" y="770" width="220" height="92" rx="12" fill="#f8fafc" stroke="#e2e8f0" />
  <text x="1062" y="799" class="label sans">Estimated Move-ins</text>
  <text x="1062" y="847" class="smallMetric sans">3</text>

  <rect x="1274" y="770" width="182" height="92" rx="12" fill="#f8fafc" stroke="#e2e8f0" />
  <text x="1292" y="799" class="label sans">Estimated Revenue</text>
  <text x="1292" y="847" class="smallMetric sans">$18K</text>
</svg>
